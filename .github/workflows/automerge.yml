name: Auto-merge to dev

on:
  push:
    branches:
      - "claude/**"
      - "cursor/**"

concurrency:
  group: automerge-to-dev
  cancel-in-progress: false

jobs:
  automerge-to-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge into dev
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git fetch origin "$BRANCH_NAME"
          git checkout dev
          git pull origin dev
          if ! git merge --no-ff "$BRANCH_NAME" -m "Auto-merge $BRANCH_NAME into dev"; then
            echo "ERROR: Merge conflict detected. Aborting." >&2
            git merge --abort
            exit 1
          fi
          git push origin dev
