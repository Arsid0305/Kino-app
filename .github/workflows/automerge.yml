name: Auto-merge feature branches

on:
  push:
    branches:
      - claude/**

jobs:
  automerge-to-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge into dev
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git fetch origin dev
          git checkout dev
          if ! git merge --no-ff ${{ github.ref_name }} -m "Auto-merge ${{ github.ref_name }} into dev"; then
            echo "Merge conflict detected — aborting"
            git merge --abort
            exit 1
          fi
          git push origin dev
